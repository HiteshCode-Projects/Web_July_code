<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let username = "John"

        console.log("Hello guys My Name is " + username + " Good Evening")


        //Modern - Template String -  `` BackTick
        // Variable + text - 
        // ${VariableName/Parameter Name}

        let customername = "David"

        console.log(`Hello Guys My Name is ${customername} good Eveing Have a nice Day `)


        //setTimeout(function)  - Acts Like Timer To Fucntion , 1000 means 1 sec

        setTimeout(()=>{

            console.log("Hii I will Run After 5 Seconds")

        },5000)


       // setInterval()

       setInterval(()=>{
           console.log("After Every 2 second Break I will Run")
       },2000)
    </script>
</body>
</html>
